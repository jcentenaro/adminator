name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      # `zip -j` junks paths, which flattened assets/static/** to the archive
      # root and broke every relative asset reference in the released zips.
      # Zipping from inside dist/ preserves the directory structure.
      - name: Build minified release
        run: |
          npm run release:minified
          (cd dist && zip -r ../static_minified.zip .)

      - name: Build unminified release
        run: |
          npm run release:unminified
          (cd dist && zip -r ../static_unminified.zip .)

      - name: Verify release archive structure
        run: |
          unzip -l static_minified.zip | grep -q 'assets/static/' \
            || { echo "::error::Release zip lost its assets/static/ paths"; exit 1; }
          unzip -l static_minified.zip | grep -q 'index.html' \
            || { echo "::error::Release zip is missing index.html"; exit 1; }

      - name: Get version
        id: version
        run: echo "version=v$(./ci/getVersion.sh)" >> $GITHUB_OUTPUT

      - name: Verify version
        run: ./ci/verifyVersion.sh ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            static_minified.zip
            static_unminified.zip
          fail_on_unmatched_files: true
          prerelease: false
          draft: false
          generate_release_notes: true
